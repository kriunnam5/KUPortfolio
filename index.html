<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krishna Unnam</title>
<meta name="description" content="Krishna Unnam, bioengineering student at UIUC. Biomedical devices, signal processing and data engineering.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f7ff;
  --paper: #ffffff;
  --ink: #14243b;
  --muted: #536b89;
  --line: #c7d9f2;
  --accent: #2463c9;
  --g1: rgba(36, 99, 201, 0.06);
  --g2: rgba(36, 99, 201, 0.14);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1424;
    --paper: #111f35;
    --ink: #e8f1ff;
    --muted: #9bb2d2;
    --line: #263f63;
    --accent: #69a5ff;
    --g1: rgba(105, 165, 255, 0.06);
    --g2: rgba(105, 165, 255, 0.14);
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;background-color:var(--bg);background-image:linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px),linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:22px 0}
nav strong{font-weight:800;letter-spacing:-.01em}
nav div{display:flex;gap:6px}
nav a{color:var(--ink);text-decoration:none;padding:6px 14px;border-radius:999px}
nav a:hover{background:var(--paper)}
nav a[aria-current]{background:var(--ink);color:var(--bg)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
main{padding:32px 0 72px;outline:none}
h1{font-size:clamp(3rem,11vw,7.5rem);line-height:.92;font-weight:800;letter-spacing:-.04em;margin:0 0 20px}
h2{font-size:clamp(2rem,6vw,3.4rem);line-height:1;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
h3{margin:0;font-size:1.15rem;font-weight:600}
.lede{font-size:1.25rem;max-width:44ch;margin:0;color:var(--muted)}
.intro{color:var(--muted);max-width:56ch;margin:0 0 36px}
.trace{width:100%;height:auto;margin:36px 0 12px;overflow:visible}
.trace path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);animation:draw 3.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.trace path{animation:none;stroke-dasharray:none}}
.tiles,.grid{display:grid;gap:20px}
.tiles{grid-template-columns:repeat(3,1fr);margin-top:28px}
.grid{grid-template-columns:repeat(2,1fr);align-items:stretch}
.tile,.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;overflow:hidden}
.tile{padding:22px}
.tile b{font-size:1.4rem;letter-spacing:-.02em}
.tile span{color:var(--muted);margin-top:6px}
.tile:hover,.card:hover{border-color:var(--accent)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-bottom:1px solid var(--line)}
.ph{aspect-ratio:16/10;display:flex;flex-direction:column;justify-content:center;padding:0 24px;border-bottom:1px solid var(--line);background:linear-gradient(var(--g1),var(--g1))}
.ph b{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;letter-spacing:-.04em;color:var(--accent)}
.ph span{color:var(--muted)}
.meta{padding:16px 18px 20px}
.meta p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.back{display:inline-block;margin-bottom:28px;color:var(--ink)}
.shot{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:28px 0 8px;background:var(--paper)}
.cap{color:var(--muted);font-size:.9rem;margin:0 0 28px}
.detail p,.detail ul{max-width:62ch}
.detail ul{padding-left:1.1em}
.detail li{margin-bottom:8px}
.role{color:var(--accent);font-weight:600;margin:0 0 28px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 0}.links a{background:var(--paper);border:1px solid var(--accent);border-radius:999px;padding:8px 18px;color:var(--ink);text-decoration:none}.links a:hover{background:var(--accent);color:var(--bg)}
.next{display:block;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:170px 1fr;gap:8px 32px;border-top:1px solid var(--line);padding:22px 0 26px}
.job .when{color:var(--muted)}
.job .role{margin:0 0 8px;font-weight:600}
.job p{margin:0;max-width:62ch}
.job p.role{color:var(--accent)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px}
.box h3{margin-bottom:10px}
.box p{margin:0 0 10px}
footer{padding:24px 0 40px;color:var(--muted);font-size:.9rem}
@media (max-width:760px){.tiles,.grid,.about,.job{grid-template-columns:1fr}nav div{flex-wrap:wrap}}
</style>
</head>
