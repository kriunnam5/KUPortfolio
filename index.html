<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krishna Unnam</title>
<meta name="description" content="Krishna Unnam, bioengineering student at UIUC. Biomedical devices, signal processing and data engineering.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f4;--paper:#fffdfc;--ink:#26181a;--muted:#75595c;--line:#e3c3c3;--accent:#c4282d;--g1:rgba(196,40,45,.07);--g2:rgba(196,40,45,.17)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1411;--paper:#111b17;--ink:#e6f3ec;--muted:#8aa598;--line:#254036;--accent:#5be3a0;--g1:rgba(91,227,160,.06);--g2:rgba(91,227,160,.14)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;background-color:var(--bg);background-image:linear-gradient(var(--g2) 1px,transparent 1px),linear-gradient(90deg,var(--g2) 1px,transparent 1px),linear-gradient(var(--g1) 1px,transparent 1px),linear-gradient(90deg,var(--g1) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:22px 0}
nav strong{font-weight:800;letter-spacing:-.01em}
nav div{display:flex;gap:6px}
nav a{color:var(--ink);text-decoration:none;padding:6px 14px;border-radius:999px}
nav a:hover{background:var(--paper)}
nav a[aria-current]{background:var(--ink);color:var(--bg)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
main{padding:32px 0 72px;outline:none}
h1{font-size:clamp(3rem,11vw,7.5rem);line-height:.92;font-weight:800;letter-spacing:-.04em;margin:0 0 20px}
h2{font-size:clamp(2rem,6vw,3.4rem);line-height:1;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
h3{margin:0;font-size:1.15rem;font-weight:600}
.lede{font-size:1.25rem;max-width:44ch;margin:0;color:var(--muted)}
.intro{color:var(--muted);max-width:56ch;margin:0 0 36px}
.trace{width:100%;height:auto;margin:36px 0 12px;overflow:visible}
.trace path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:var(--len);animation:draw 3.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.trace path{animation:none;stroke-dasharray:none}}
.tiles,.grid{display:grid;gap:20px}
.tiles{grid-template-columns:repeat(3,1fr);margin-top:28px}
.grid{grid-template-columns:repeat(2,1fr);align-items:stretch}
.tile,.card{display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;overflow:hidden}
.tile{padding:22px}
.tile b{font-size:1.4rem;letter-spacing:-.02em}
.tile span{color:var(--muted);margin-top:6px}
.tile:hover,.card:hover{border-color:var(--accent)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-bottom:1px solid var(--line)}
.ph{aspect-ratio:16/10;display:flex;flex-direction:column;justify-content:center;padding:0 24px;border-bottom:1px solid var(--line);background:linear-gradient(var(--g1),var(--g1))}
.ph b{font-size:clamp(2.4rem,6vw,3.6rem);line-height:1;letter-spacing:-.04em;color:var(--accent)}
.ph span{color:var(--muted)}
.meta{padding:16px 18px 20px}
.meta p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.back{display:inline-block;margin-bottom:28px;color:var(--ink)}
.shot{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:28px 0 8px;background:var(--paper)}
.cap{color:var(--muted);font-size:.9rem;margin:0 0 28px}
.detail p,.detail ul{max-width:62ch}
.detail ul{padding-left:1.1em}
.detail li{margin-bottom:8px}
.role{color:var(--accent);font-weight:600;margin:0 0 28px}
.next{display:block;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.job{display:grid;grid-template-columns:170px 1fr;gap:8px 32px;border-top:1px solid var(--line);padding:22px 0 26px}
.job .when{color:var(--muted)}
.job .role{margin:0 0 8px;font-weight:600}
.job p{margin:0;max-width:62ch}
.job p.role{color:var(--accent)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px}
.box h3{margin-bottom:10px}
.box p{margin:0 0 10px}
footer{padding:24px 0 40px;color:var(--muted);font-size:.9rem}
@media (max-width:760px){.tiles,.grid,.about,.job{grid-template-columns:1fr}nav div{flex-wrap:wrap}}
</style>
</head>

{id:'explainable-ecg',t:'Explainable AI for ECG Diagnosis',tag:'CNN-LSTM · SHAP',big:'85%',small:'binary classification accuracy',when:'Nov 2025 – Present',role:'Machine Learning Engineer',pts:['Developed a CNN-LSTM pipeline for ECG arrhythmia detection and classification, reaching 85% binary classification accuracy.','Built a preprocessing pipeline for PQRST-aligned ECG segmentation and feature extraction to make the model more stable.','Designed a SHAP-based explainability framework that shows which waveform regions drive each prediction.']},

const app=document.getElementById('app');
const jobs=l=>l.map(j=>`<div class="job"><div class="when">${j[0]}</div><div><h3>${j[1]}</h3><p class="role">${j[2]}</p><p>${j[3]}</p></div></div>`).join('');
const home=()=>`<h1>Krishna Unnam</h1><p class="lede">Bioengineering student at UIUC building biomedical devices, signal processing tools and data pipelines that improve patient care.</p>
<svg class="trace" viewBox="0 0 1200 150" aria-hidden="true"><path id="tr"/></svg>
<div class="tiles"><a class="tile" href="#/work"><b>Work</b><span>6 projects in ECG, graph data and embedded systems</span></a><a class="tile" href="#/experience"><b>Experience</b><span>Internships and leadership roles</span></a><a class="tile" href="#/about"><b>About</b><span>Education, skills and contact</span></a></div>`;
const work=()=>`<h2>Work</h2><p class="intro">Projects in biomedical signals, graph data and hardware. Open one for details.</p><div class="grid">${P.map(p=>`<a class="card" href="#/work/${p.id}">${p.img?`<img data-img="${p.img}" alt="">`:`<div class="ph"><b>${p.big}</b><span>${p.small}</span></div>`}<div class="meta"><h3>${p.t}</h3><p>${p.tag}</p></div></a>`).join('')}</div>`;
const detail=p=>{const i=P.indexOf(p),n=P[(i+1)%P.length];return `<div class="detail"><a class="back" href="#/work">&larr; All work</a><h2>${p.t}</h2><p class="role">${p.when?p.when+' · '+p.role:p.tag}</p>${p.img?`<img class="shot" data-img="${p.img}" alt="${p.cap}"><p class="cap">${p.cap}</p>`:''}${p.d?p.d.map(x=>`<p>${x}</p>`).join(''):`<ul>${p.pts.map(x=>`<li>${x}</li>`).join('')}</ul>`}<a class="next" href="#/work/${n.id}">Next project: ${n.t} &rarr;</a></div>`};
const experience=()=>`<h2>Experience</h2><p class="intro">Internships, a startup and student leadership.</p>${jobs(J)}`;
const about=()=>`<h2>About</h2><p class="intro">I'm a bioengineering student at the University of Illinois Urbana-Champaign, graduating December 2027, with minors in Computer Science and Electrical Engineering. I like combining hardware and software to build devices that make hospital stays better for patients.</p>
<div class="about"><div class="box"><h3>Skills</h3><p>Programming and imaging: Java, C++, JavaScript, HTML/CSS, React, Node.js, OpenCV, TensorFlow.</p><p>Data: Python, SQL, MATLAB, Power BI, time-series analysis.</p><p>Hardware: Arduino, KiCad, Fusion 360, Simulink, PCB design.</p></div>
<div class="box"><h3>Contact</h3><p><a href="mailto:kunna@illinois.edu">kunna@illinois.edu</a></p><p><a href="https://linkedin.com/in/krishna-unnam">LinkedIn</a></p><p><a href="KU_Resume.pdf">Resume (PDF)</a></p></div></div>`;
function draw(){const t=document.getElementById('tr');if(!t)return;let d='M0,100';for(let i=0;i<6;i++){const x=i*200;d+=` L${x+40},100 Q${x+55},78 ${x+70},100 L${x+90},100 L${x+98},112 L${x+110},14 L${x+122},128 L${x+132},100 L${x+150},100 Q${x+170},66 ${x+190},100 L${x+200},100`}t.setAttribute('d',d);t.style.setProperty('--len',Math.ceil(t.getTotalLength()))}
let last='';
function render(){const [p='',id]=location.hash.replace(/^#\/?/,'').split('/');const x=p==='work'&&id&&P.find(q=>q.id===id);
let h,title='Krishna Unnam',page=p;
if(x){h=detail(x);title=x.t+' – Krishna Unnam'}else if(p==='work'){h=work();title='Work – Krishna Unnam'}else if(p==='experience'){h=experience();title='Experience – Krishna Unnam'}else if(p==='about'){h=about();title='About – Krishna Unnam'}else{h=home();page='home'}
app.innerHTML=h;app.querySelectorAll('img[data-img]').forEach(i=>i.src=IMG[i.dataset.img]);
document.querySelectorAll('#tabs a').forEach(a=>a.dataset.p===page?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
document.title=title;if(last!==location.hash)window.scrollTo(0,0);last=location.hash;draw()}
window.addEventListener('hashchange',render);render();
